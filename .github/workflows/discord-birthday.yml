name: Enviar presente no Discord

on:
  schedule:
    # 00:00 de 25/11 no horário de Brasília (UTC-3) = 03:00 UTC.
    - cron: "0 3 25 11 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-birthday-link:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar data e enviar o link
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # O agendamento é anual, mas esta surpresa deve ser enviada apenas em 2026.
          TODAY_BR=$(TZ=America/Sao_Paulo date +%F)
          if [ "$TODAY_BR" != "2026-11-25" ]; then
            echo "Hoje não é a data programada para esta surpresa. Nada será enviado."
            exit 0
          fi

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "Configure o secret DISCORD_WEBHOOK_URL nas configurações do repositório."
            exit 1
          fi

          OWNER="${REPOSITORY%%/*}"
          REPO="${REPOSITORY#*/}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            SITE_URL="https://${OWNER}.github.io/"
          else
            SITE_URL="https://${OWNER}.github.io/${REPO}/"
          fi

          export SITE_URL
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"content":"🎁 **Uma surpresa chegou!**\n\nHoje é um dia muito especial! Preparei algo com muito carinho para você. ❤️\n\n**Seu presente está aqui:**\n" + os.environ["SITE_URL"]}))')
          SITE_URL="$SITE_URL" curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

          echo "Webhook enviado."
